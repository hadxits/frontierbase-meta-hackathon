<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc"><title id="title">Actual Muse output: seven source rows, one return destination, both deadlines preserved</title><desc id="desc">A return guide generated from seven source rows in the synthetic apparel example. Seven source rows support the generated return answer. The answer retains a 30-day request window and 14 days to mail from label issue, even beyond that window.</desc><rect width="1280" height="480" rx="22" fill="#0d1424"/><text x="36" y="44" fill="#f4f7ff" font-size="25" font-weight="700" font-family="Arial, Helvetica, sans-serif">A RETURN POLICY CUSTOMERS CAN FOLLOW</text><text x="36" y="76" fill="#a4b8da" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif">Seven source rows behind one return guide · apparel-store example</text><rect x="36" y="102" width="328" height="318" rx="14" fill="#111e32" stroke="#30415b"/><rect x="394" y="102" width="322" height="318" rx="14" fill="#111e32" stroke="#30415b"/><rect x="746" y="102" width="498" height="318" rx="14" fill="#111e32" stroke="#30415b"/><text x="56" y="138" fill="#88d9f2" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif">STORE POLICIES</text><text x="56" y="175" fill="#c9d5e8" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Return eligibility</text><text x="56" y="205" fill="#c9d5e8" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Start a return</text><text x="56" y="235" fill="#c9d5e8" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Label fees</text><text x="56" y="265" fill="#c9d5e8" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Return without a printer</text><text x="56" y="295" fill="#c9d5e8" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Label deadline</text><text x="56" y="325" fill="#c9d5e8" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Help without the portal</text><text x="56" y="355" fill="#c9d5e8" font-size="18" font-weight="400" font-family="Arial, Helvetica, sans-serif">Support hours</text><text x="414" y="138" fill="#b8a8ff" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif">MENU ITEM</text><text x="414" y="185" fill="#c9d5e8" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Returns and exchanges</text><text x="414" y="218" fill="#c9d5e8" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">↓</text><text x="414" y="251" fill="#c9d5e8" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">Start and send returns</text><text x="414" y="284" fill="#c9d5e8" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">↓</text><text x="414" y="317" fill="#f4f7ff" font-size="19" font-weight="700" font-family="Arial, Helvetica, sans-serif">Start and send a return</text><text x="766" y="138" fill="#88d9f2" font-size="16" font-weight="700" font-family="Arial, Helvetica, sans-serif">RETURN GUIDANCE</text><text x="766" y="181" fill="#f4f7ff" font-size="20" font-weight="500" font-family="Arial, Helvetica, sans-serif">“Hand the parcel to USPS within 14 calendar</text><text x="766" y="210" fill="#f4f7ff" font-size="20" font-weight="500" font-family="Arial, Helvetica, sans-serif">days of label issue, even if the 30-day</text><text x="766" y="239" fill="#f4f7ff" font-size="20" font-weight="500" font-family="Arial, Helvetica, sans-serif">window ends.”</text><text x="766" y="326" fill="#8bdff3" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">30 days to request</text><text x="766" y="365" fill="#b8a8ff" font-size="23" font-weight="700" font-family="Arial, Helvetica, sans-serif">14 days from label issue to mail</text><text x="36" y="454" fill="#a4b8da" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif">Return conditions, label fees and mailing instructions stay together in one answer.</text></svg>
