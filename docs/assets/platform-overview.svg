<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="270" viewBox="0 0 1280 270" role="img" aria-labelledby="title desc">
<title id="title">FrontierBase: one knowledge base for chat and voice support</title>
<desc id="desc">Business spreadsheets and documents feed FrontierBase's support knowledge base. The existing platform uses it for AI chat. The hackathon adds Muse-generated voice menus and answers for staff review.</desc>
