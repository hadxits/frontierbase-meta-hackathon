<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="712" viewBox="0 0 1280 712" role="img" aria-labelledby="title desc">
<title id="title">FrontierBase backend architecture</title><desc id="desc">Spreadsheet snapshots feed existing conversational retrieval and a separate queued Muse ARS generation path. Meta powers ARS generation, not the existing chat clarification engine. Separate route and answer audits trigger scoped repairs; unresolved issues block publication. Staff review precedes publication.</desc>
