<text x="682" y="481" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f4f7ff">Route + answer audits → scoped repair</text>
<text x="682" y="507" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a4b8da">Exact-source checks; up to two targeted repair rounds</text>
