<text x="82" y="481" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f4f7ff">Evidence-aware response</text>
<text x="82" y="507" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a4b8da">Answer, clarify or abstain; conditional escalation offer</text>
