<text x="682" y="289" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f4f7ff">Generation request → Cloud Tasks</text>
<text x="682" y="315" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a4b8da">Authenticated API → OIDC-protected worker</text>
