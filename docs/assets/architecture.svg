<rect x="64" y="548" width="520" height="70" rx="14" fill="#111e32" stroke="#2a3b57"/>
<text x="82" y="577" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f4f7ff">Persist context / offer Issue Track</text>
<text x="82" y="603" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a4b8da">Optional support tickets retain the conversation context.</text>
<rect x="664" y="548" width="552" height="70" rx="14" fill="#111e32" stroke="#2a3b57"/>
<text x="682" y="577" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f4f7ff">Staff review → publish → voice playback</text>
<text x="682" y="603" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a4b8da">Unresolved issues block publishing; ElevenLabs speech</text>
<text x="40" y="683" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#a4b8da">The same business knowledge supports conversational answers and guided voice menus.</text>
