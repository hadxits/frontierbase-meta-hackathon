<rect width="1280" height="712" rx="24" fill="url(#bg)"/>
<text x="40" y="48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f4f7ff">FRONTIERBASE ARCHITECTURE</text>
<rect x="40" y="80" width="440" height="72" rx="14" fill="#111e32" stroke="#2a3b57"/>
<text x="62" y="110" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#f4f7ff">CSV / spreadsheet snapshots</text>
<text x="62" y="137" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#a4b8da">Upload normalization + Google Sheets sync</text>
