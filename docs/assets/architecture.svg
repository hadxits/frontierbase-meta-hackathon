<text x="664" y="238" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#81d9f4">MUSE MENU GENERATION · ASYNC JOB</text>
<rect x="64" y="260" width="520" height="72" rx="14" fill="#111e32" stroke="#2a3b57"/>
<text x="82" y="289" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f4f7ff">Question + conversation state</text>
<text x="82" y="315" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a4b8da">Existing multi-provider analysis; Firebase session history</text>
<rect x="64" y="356" width="520" height="72" rx="14" fill="#111e32" stroke="#2a3b57"/>
<text x="82" y="385" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f4f7ff">Business knowledge retrieval</text>
<text x="82" y="411" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#a4b8da">Existing ingestion → embeddings + Qdrant dense / BM25</text>
